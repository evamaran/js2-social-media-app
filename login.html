<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Login | CodeRoom</title>
	<meta name="description"
		content="Log in to your CodeRoom account to explore posts, create content, and connect with the community.">

	<link rel="icon" type="image/png" href="favicon.png">
  <script type="module" crossorigin src="./assets/components-GDkjcwQc.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/components-CYBc70eV.css">
</head>

<body>

	<!-- Header -->
	<header class="site-header"></header>

	<!-- Main -->
	<main class="main-content">

		<section class="auth-container">
			<h2>Login</h2>

			<form id="loginForm">
				<input id="email" type="email" name="email" placeholder="Email" required>
				<input id="password" type="password" name="password" placeholder="Password" required>

				<button type="submit">Log in</button>
			</form>

			<p class="auth-message"></p>

			<p class="auth-link">
				Don't have an account? <a href="register.html">Create one</a>
			</p>
		</section>

	</main>

	<!-- Navbar -->
	<nav class="site-nav"></nav>


</body>

</html>
