<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Register | CodeRoom</title>
	<meta name="description"
		content="Create your CodeRoom account and start posting, exploring, and connecting with the community.">

	<link rel="icon" type="image/png" href="favicon.png">
  <script type="module" crossorigin src="./assets/components-CbbrKJdJ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/components-CGPYKBSX.css">
</head>

<body>

	<!-- Header -->
	<header class="site-header"></header>

	<!-- Main -->
	<main class="main-content">

		<section class="auth-container">
			<h2>Register</h2>

			<form id="registerForm">
				<input id="name" type="text" name="name" placeholder="Username" required>
				<p class="auth-message small">Username can only contain letters, numbers and _</p>
				<input id="email" type="email" name="email" placeholder="Email" required>
				<input id="password" type="password" name="password" placeholder="Password" required>
				<button type="submit">Register now</button>
			</form>
			<p class="auth-message"></p>
			<p class="auth-link">
				Already have an account? <a href="login.html">Log in here.</a>
			</p>
		</section>

	</main>

	<!-- Navbar -->
	<nav class="site-nav"></nav>


</body>

</html>
