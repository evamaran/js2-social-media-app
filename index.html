<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>CodeRoom</title>
	<meta name="description"
		content="A platform for exploring posts, creating content, and interacting with the CodeRoom community.">

	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<!-- Header -->
	<header class="site-header"></header>

	<!-- Main -->
	<main class="main-content">

		<!-- Filters -->
		<section class="filters">
			<button class="filter-chip active">All</button>
			<button class="filter-chip">JS2</button>
			<button class="filter-chip">Frontend</button>
			<button class="filter-chip">Debuglife</button>
			<button class="filter-chip">UI</button>
			<button class="filter-chip">Stories</button>
		</section>

		<!-- Posts -->
		<section class="posts">

			<!-- Post card template (empty, API will fill it) -->
			<article class="card">
				<div class="card-header">
					<img class="avatar" alt="">
					<div class="card-user">
						<h4 class="username"></h4>
						<span class="timestamp"></span>
					</div>
				</div>

				<img class="post-image" alt="">

				<p class="post-text"></p>

				<div class="card-footer">
					<div class="icon-group likes">
						<img src="icons/like.svg" alt="Likes">
						<span class="like-count"></span>
					</div>
					<div class="icon-group comments">
						<img src="icons/comment.svg" alt="Comments">
						<span class="comment-count"></span>
					</div>
				</div>
			</article>

		</section>

	</main>

	<!-- Navbar -->
	<nav class="site-nav"></nav>

	<!-- Login overlay -->
	<div class="login-overlay hidden">
		<div class="login-box">
			<h2>Welcome back</h2>
			<p>Please log in to continue.</p>

			<input type="email" class="login-input" placeholder="Email">
			<input type="password" class="login-input" placeholder="Password">

			<button class="login-btn">Log in</button>

			<p class="login-register">
				Don't have an account? <a href="register.html">Create one</a>
			</p>
		</div>
	</div>

	<script type="module" src="./src/js/components.js"></script>

</body>

</html>
